name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build universal release
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Package smoke test
        run: SKIP_BUILD=1 UNIVERSAL=1 Scripts/make_app.sh
      - name: Verify bundle
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' .build/app/SkillHub.app/Contents/Info.plist)" = "$(tr -d '[:space:]' < VERSION)"
          codesign --verify --deep --strict .build/app/SkillHub.app
          lipo -archs .build/app/SkillHub.app/Contents/MacOS/SkillHub | grep -q arm64
          lipo -archs .build/app/SkillHub.app/Contents/MacOS/SkillHub | grep -q x86_64

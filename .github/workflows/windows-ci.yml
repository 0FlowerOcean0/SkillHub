name: Windows

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            windows/src-tauri/target/
          key: windows-cargo-${{ hashFiles('windows/src-tauri/Cargo.toml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Test native core
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SkillHub-Windows-x64
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
